services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alphainvest-backend:local
    container_name: alphainvest-api
    command:
      - uvicorn
      - alphainvest.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: alphainvest-backend:local
    container_name: alphainvest-worker
    command:
      - alphainvest-worker
    env_file:
      - ./backend/.env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - worker

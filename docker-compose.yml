services:
  mongo:
    image: mongo:8.0
    container_name: alphainvest-mongodb

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: alphainvest-backend:local
    container_name: alphainvest-api

    command:
      - uvicorn
      - alphainvest.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    env_file:
      - ./backend/.env

    environment:
      APP_MONGODB_URI: mongodb://mongo:27017
      APP_MONGODB_DATABASE: alphainvest_documents

      # El API no ejecuta el scheduler del worker.
      APP_WORKER_ENABLED: "false"

    depends_on:
      mongo:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/v1/health/ready',
          timeout=5
          )
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: alphainvest-backend:local
    container_name: alphainvest-worker

    command:
      - alphainvest-worker

    env_file:
      - ./backend/.env

    environment:
      APP_MONGODB_URI: mongodb://mongo:27017
      APP_MONGODB_DATABASE: alphainvest_documents

      # El worker debe permanecer habilitado aunque el .env local cambie.
      APP_WORKER_ENABLED: "true"

    depends_on:
      mongo:
        condition: service_healthy

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    profiles:
      - worker

volumes:
  mongo_data:

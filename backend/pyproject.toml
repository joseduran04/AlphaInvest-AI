[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphainvest-backend"
version = "1.0.0"
description = "Backend modular de AlphaInvest AI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0.41,<2.2",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.16,<2.0",
    "PyJWT>=2.10,<3.0",
    "argon2-cffi>=25.1,<26.0",
    "email-validator>=2.2,<3.0",
    "httpx>=0.28,<1.0",
    "pymongo>=4.13,<5.0",
    "APScheduler>=3.11,<4.0",

    "numpy>=2.1,<3.0",
    "scikit-learn>=1.6,<2.0",
    "xgboost>=3.0,<4.0",
    "torch>=2.13,<3.0",
    "transformers>=4.57,<5.0",

    "yfinance>=1.6,<2.0",
    "exchange-calendars>=4.12,<5.0",
]

[project.scripts]
alphainvest-worker = "alphainvest.worker.main:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "httpx2>=2.12,<3.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "unit: pruebas unitarias",
    "integration: pruebas de integración",
    "database: pruebas que requieren PostgreSQL",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "yfinance",
    "yfinance.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "exchange_calendars",
    "exchange_calendars.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["alphainvest"]
branch = true

[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP", "ASYNC"]

ignore = [
    "B008",
    "UP046",
]